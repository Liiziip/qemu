name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟪', arch: aarch64, mode: dynamic }
          - { icon: '🟪', arch: aarch64, mode: static }

    name: 🚧${{ matrix.icon }} Windows ARM64 Build ${{ matrix.mode }}
    defaults:
      run:
        shell: msys2 {0}
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@main

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
          python
          python-setuptools
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          gcc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          python:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p

    - name: 'Install ARM64 cross-compilation toolchain'
      run: |
        pacman -S --noconfirm mingw-w64-cross-toolchain
        pacman -S --noconfirm mingw-w64-cross-gcc
        # 安装 ARM64 的依赖库
        pacman -S --noconfirm mingw-w64-cross-glib2 mingw-w64-cross-pixman mingw-w64-cross-libpng mingw-w64-cross-SDL2 mingw-w64-cross-libjpeg-turbo mingw-w64-cross-zlib mingw-w64-cross-lzo2 mingw-w64-cross-libffi mingw-w64-cross-gettext mingw-w64-cross-libiconv mingw-w64-cross-zstd mingw-w64-cross-libssh mingw-w64-cross-gnutls mingw-w64-cross-nettle mingw-w64-cross-libtasn1 mingw-w64-cross-libgcrypt mingw-w64-cross-libusb mingw-w64-cross-capstone mingw-w64-cross-dtc mingw-w64-cross-libnfs mingw-w64-cross-snappy mingw-w64-cross-curl mingw-w64-cross-libslirp

    - name: '🚧 Build QEMU Windows ARM64 (arm & aarch64) ${{ matrix.mode }}'
      env:
        arg: ${{ matrix.mode == 'dynamic' && '--enable-sdl --enable-fdt=system --target-list=arm-softmmu,aarch64-softmmu' || '--disable-gtk --disable-spice --disable-usb-redir --disable-smartcard --disable-gnutls --disable-vnc-sasl --disable-libssh --enable-sdl --enable-fdt=system --target-list=arm-softmmu,aarch64-softmmu --static --extra-cflags="-DCURL_STATICLIB -DLIBSSH_STATIC -DLIBSLIRP_STATIC -DCAIRO_WIN32_STATIC_BUILD"' }}
      run: |
          CROSS_PREFIX="aarch64-w64-mingw32-"
          ARG="${{ env.arg }}"
          
          # 设置环境变量
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/mingw64"
          export PATH="/mingw64/bin:$PATH"
          
          echo "ARM64 cross-compilation configuration:"
          echo "ARG: $ARG"
          echo "CROSS_PREFIX: $CROSS_PREFIX"
          
          ./configure $ARG --cross-prefix=$CROSS_PREFIX
          make -j16

    - name: Prepare Artifacts
      shell: cmd
      run: |
          md ${{ github.workspace }}\artifacts
          cd ${{ github.workspace }}\artifacts
          move D:\a\qemu\qemu\build\*.exe
          move D:\a\qemu\qemu\build\pc-bios share
          robocopy D:\a\qemu\qemu\pc-bios share /xn /xo /mov
          del share\*.bz2

    - name: Prepare Artifacts (dynamic only)
      shell: cmd
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
          cd ${{ github.workspace }}\artifacts
          copy D:\a\_temp\msys64\mingw64\aarch64-w64-mingw32\bin\*.dll
          md lib\gdk-pixbuf-2.0\2.10.0
          fsutil file createNew lib\gdk-pixbuf-2.0\2.10.0\loaders.cache 0
          move D:\a\qemu\qemu\build\po share\locale

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: QEMU Windows ARM64 (${{ matrix.mode }} build)
        path: ${{ github.workspace }}/artifacts
        compression-level: 9
