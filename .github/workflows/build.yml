name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟪', arch: aarch64, mode: dynamic }
          - { icon: '🟪', arch: aarch64, mode: static }

    name: 🚧${{ matrix.icon }} Windows ARM64 Build ${{ matrix.mode }}
    defaults:
      run:
        shell: msys2 {0}
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@main

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
          python
          python-setuptools
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-python
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-libffi
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-llvm
          mingw-w64-x86_64-clang
          mingw-w64-x86_64-lld

    - name: 'Setup LLVM for ARM64 cross-compilation'
      run: |
        # 验证 LLVM/Clang 安装
        echo "Checking LLVM/Clang installation..."
        clang --version
        llvm-ar --version 2>/dev/null || echo "llvm-ar not found"
        
        # 检查 ARM64 目标支持
        echo "ARM64 targets:"
        llvm-objdump --version 2>/dev/null | grep -i aarch64 || echo "aarch64 support might need llvm-targets"
        
        # 创建交叉编译目录结构
        mkdir -p /mingw64/aarch64-w64-mingw32/lib
        mkdir -p /mingw64/aarch64-w64-mingw32/include
        mkdir -p /mingw64/aarch64-w64-mingw32/bin
        
        # 创建 pkg-config 包装器
        cat > /usr/local/bin/aarch64-w64-mingw32-pkg-config << 'EOF'
#!/bin/bash
PKG_CONFIG_PATH="/mingw64/aarch64-w64-mingw32/lib/pkgconfig:/mingw64/lib/pkgconfig" \
PKG_CONFIG_SYSROOT_DIR="/mingw64/aarch64-w64-mingw32" \
pkg-config "$@"
EOF
        chmod +x /usr/local/bin/aarch64-w64-mingw32-pkg-config

    - name: 'Build minimal dependencies for ARM64'
      run: |
        # 使用 clang 交叉编译 zlib
        cd /tmp
        rm -rf zlib
        git clone --depth 1 https://github.com/madler/zlib.git
        cd zlib
        
        # 使用 clang 交叉编译到 ARM64 Windows
        export CC="clang --target=aarch64-w64-windows-gnu"
        export AR="llvm-ar"
        export RANLIB="llvm-ranlib"
        
        # 配置和编译
        ./configure --prefix=/mingw64/aarch64-w64-mingw32 --static
        make -j$(nproc)
        make install
        
        echo "zlib built successfully for ARM64"
        ls -la /mingw64/aarch64-w64-mingw32/lib/ 2>/dev/null || echo "lib directory not created"

    - name: '🚧 Build QEMU Windows ARM64 (arm & aarch64) ${{ matrix.mode }}'
      env:
        arg: ${{ matrix.mode == 'dynamic' && '--target-list=arm-softmmu,aarch64-softmmu' || '--target-list=arm-softmmu,aarch64-softmmu --static' }}
      run: |
          export PATH="/mingw64/bin:$PATH"
          
          # 设置 LLVM/Clang 交叉编译环境
          export CC="clang --target=aarch64-w64-windows-gnu"
          export CXX="clang++ --target=aarch64-w64-windows-gnu"
          export AR="llvm-ar"
          export RANLIB="llvm-ranlib"
          export NM="llvm-nm"
          export STRIP="llvm-strip"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export LD="lld-link"
          export PKG_CONFIG_PATH="/mingw64/aarch64-w64-mingw32/lib/pkgconfig:/mingw64/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/mingw64/aarch64-w64-mingw32"
          
          echo "ARM64 cross-compilation with LLVM/Clang:"
          echo "CC: $CC"
          echo "AR: $AR"
          
          # 最小化配置
          MINIMAL_ARGS="--target-list=arm-softmmu,aarch64-softmmu \
            --disable-gtk \
            --disable-spice \
            --disable-usb-redir \
            --disable-smartcard \
            --disable-gnutls \
            --disable-vnc-sasl \
            --disable-libssh \
            --disable-sdl \
            --disable-fdt \
            --disable-capstone \
            --disable-libnfs \
            --disable-snappy \
            --disable-libusb \
            --disable-lzo \
            --disable-zstd \
            --disable-curl \
            --disable-libslirp \
            --disable-guest-agent \
            --disable-docs \
            --disable-tools \
            --disable-werror"
          
          if [[ "${{ matrix.mode }}" == "static" ]]; then
            MINIMAL_ARGS="$MINIMAL_ARGS --static"
          else
            # 对于动态构建，避免静态链接
            MINIMAL_ARGS="$MINIMAL_ARGS --disable-static"
          fi
          
          echo "Configure arguments: $MINIMAL_ARGS"
          
          # 尝试配置
          ./configure $MINIMAL_ARGS || {
            echo "Standard configure failed, trying with explicit cross-prefix..."
            ./configure $MINIMAL_ARGS --cross-prefix="clang --target=aarch64-w64-windows-gnu "
          }
          
          make -j16

    - name: Prepare Artifacts
      shell: cmd
      run: |
          md ${{ github.workspace }}\artifacts
          cd ${{ github.workspace }}\artifacts
          move D:\a\qemu\qemu\build\*.exe
          move D:\a\qemu\qemu\build\pc-bios share
          robocopy D:\a\qemu\qemu\pc-bios share /xn /xo /mov
          del share\*.bz2

    - name: Prepare Artifacts (dynamic only)
      shell: cmd
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
          cd ${{ github.workspace }}\artifacts
          if exist D:\a\_temp\msys64\mingw64\aarch64-w64-mingw32\bin\*.dll (
            copy D:\a\_temp\msys64\mingw64\aarch64-w64-mingw32\bin\*.dll
          ) else (
            echo "No DLLs found for ARM64"
          )

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: QEMU Windows ARM64 (${{ matrix.mode }} build)
        path: ${{ github.workspace }}/artifacts
        compression-level: 9
