name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟪', arch: aarch64, mode: dynamic }
          - { icon: '🟪', arch: aarch64, mode: static }

    name: 🚧${{ matrix.icon }} Windows ARM64 Build ${{ matrix.mode }}
    defaults:
      run:
        shell: msys2 {0}
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@main

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
          python
          python-setuptools
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-python
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-libffi
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-cmake

    - name: 'Install ARM64 cross-compilation toolchain'
      run: |
        # 安装 ARM64 交叉编译工具链
        pacman -S --noconfirm --needed mingw-w64-cross-toolchain
        
        # 查找交叉编译器位置
        echo "Searching for ARM64 cross compiler..."
        find /mingw64 -name "aarch64-w64-mingw32-gcc*" 2>/dev/null || true
        find /usr -name "aarch64-w64-mingw32-gcc*" 2>/dev/null || true
        
        # 检查交叉编译器是否可用
        if command -v aarch64-w64-mingw32-gcc &> /dev/null; then
          echo "ARM64 cross compiler found in PATH"
          aarch64-w64-mingw32-gcc --version
        else
          echo "ARM64 cross compiler not in PATH, searching..."
          # 尝试找到并添加路径
          CROSS_GCC=$(find / -name "aarch64-w64-mingw32-gcc" 2>/dev/null | head -n 1)
          if [ -n "$CROSS_GCC" ]; then
            CROSS_DIR=$(dirname "$CROSS_GCC")
            echo "Found at: $CROSS_DIR"
            export PATH="$CROSS_DIR:$PATH"
            echo "$CROSS_DIR" >> $GITHUB_PATH
          else
            echo "ERROR: ARM64 cross compiler not found!"
            # 尝试其他包名
            pacman -Ss mingw-w64 | grep -i aarch64 || true
            pacman -Ss mingw-w64 | grep -i arm64 || true
            exit 1
          fi
        fi
        
        # 创建交叉编译目录结构
        mkdir -p /mingw64/aarch64-w64-mingw32/lib
        mkdir -p /mingw64/aarch64-w64-mingw32/include
        mkdir -p /mingw64/aarch64-w64-mingw32/bin

    - name: 'Build zlib for ARM64'
      run: |
        # 确保交叉编译器在 PATH 中
        if ! command -v aarch64-w64-mingw32-gcc &> /dev/null; then
          CROSS_GCC=$(find / -name "aarch64-w64-mingw32-gcc" 2>/dev/null | head -n 1)
          if [ -n "$CROSS_GCC" ]; then
            CROSS_DIR=$(dirname "$CROSS_GCC")
            export PATH="$CROSS_DIR:$PATH"
          else
            echo "ERROR: ARM64 cross compiler still not found!"
            exit 1
          fi
        fi
        
        echo "Using cross compiler: $(which aarch64-w64-mingw32-gcc)"
        aarch64-w64-mingw32-gcc --version
        
        cd /tmp
        
        # 清理旧目录
        rm -rf zlib
        
        # 使用 GitHub 上的 zlib 源码
        git clone --depth 1 https://github.com/madler/zlib.git
        cd zlib
        
        # 直接使用 Makefile 交叉编译 zlib
        make -f win32/Makefile.gcc \
          PREFIX=aarch64-w64-mingw32- \
          SHARED_MODE=1 \
          -j$(nproc)
        
        # 手动安装
        mkdir -p /mingw64/aarch64-w64-mingw32/include
        mkdir -p /mingw64/aarch64-w64-mingw32/lib
        mkdir -p /mingw64/aarch64-w64-mingw32/bin
        
        cp zlib.h zconf.h /mingw64/aarch64-w64-mingw32/include/
        cp libz.dll.a /mingw64/aarch64-w64-mingw32/lib/
        cp zlib1.dll /mingw64/aarch64-w64-mingw32/bin/
        
        echo "zlib installed successfully"
        ls -la /mingw64/aarch64-w64-mingw32/lib/

    - name: '🚧 Build QEMU Windows ARM64 (arm & aarch64) ${{ matrix.mode }}'
      env:
        arg: ${{ matrix.mode == 'dynamic' && '--target-list=arm-softmmu,aarch64-softmmu' || '--target-list=arm-softmmu,aarch64-softmmu --static' }}
      run: |
          # 确保交叉编译器在 PATH 中
          if ! command -v aarch64-w64-mingw32-gcc &> /dev/null; then
            CROSS_GCC=$(find / -name "aarch64-w64-mingw32-gcc" 2>/dev/null | head -n 1)
            if [ -n "$CROSS_GCC" ]; then
              CROSS_DIR=$(dirname "$CROSS_GCC")
              export PATH="$CROSS_DIR:$PATH"
            fi
          fi
          
          CROSS_PREFIX="aarch64-w64-mingw32-"
          
          # 设置环境变量
          export PKG_CONFIG_PATH="/mingw64/aarch64-w64-mingw32/lib/pkgconfig:/mingw64/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/mingw64/aarch64-w64-mingw32"
          export PATH="/mingw64/bin:/mingw64/aarch64-w64-mingw32/bin:$PATH"
          
          echo "ARM64 cross-compilation configuration:"
          echo "CROSS_PREFIX: $CROSS_PREFIX"
          echo "Cross compiler: $(which aarch64-w64-mingw32-gcc)"
          
          # 最小化配置，禁用所有可选功能
          MINIMAL_ARGS="--target-list=arm-softmmu,aarch64-softmmu \
            --disable-gtk \
            --disable-spice \
            --disable-usb-redir \
            --disable-smartcard \
            --disable-gnutls \
            --disable-vnc-sasl \
            --disable-libssh \
            --disable-sdl \
            --disable-fdt \
            --disable-capstone \
            --disable-libnfs \
            --disable-snappy \
            --disable-libusb \
            --disable-lzo \
            --disable-zstd \
            --disable-curl \
            --disable-libslirp \
            --disable-guest-agent \
            --disable-docs \
            --disable-tools"
          
          if [[ "${{ matrix.mode }}" == "static" ]]; then
            MINIMAL_ARGS="$MINIMAL_ARGS --static"
          fi
          
          echo "Configure arguments: $MINIMAL_ARGS"
          
          ./configure $MINIMAL_ARGS --cross-prefix=$CROSS_PREFIX
          make -j16

    - name: Prepare Artifacts
      shell: cmd
      run: |
          md ${{ github.workspace }}\artifacts
          cd ${{ github.workspace }}\artifacts
          move D:\a\qemu\qemu\build\*.exe
          move D:\a\qemu\qemu\build\pc-bios share
          robocopy D:\a\qemu\qemu\pc-bios share /xn /xo /mov
          del share\*.bz2

    - name: Prepare Artifacts (dynamic only)
      shell: cmd
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
          cd ${{ github.workspace }}\artifacts
          if exist D:\a\_temp\msys64\mingw64\aarch64-w64-mingw32\bin\*.dll (
            copy D:\a\_temp\msys64\mingw64\aarch64-w64-mingw32\bin\*.dll
          ) else (
            echo "No DLLs found for ARM64"
          )

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: QEMU Windows ARM64 (${{ matrix.mode }} build)
        path: ${{ github.workspace }}/artifacts
        compression-level: 9
