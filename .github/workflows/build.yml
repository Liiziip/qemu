name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟪', arch: aarch64, mode: dynamic }
          - { icon: '🟪', arch: aarch64, mode: static }

    name: 🚧${{ matrix.icon }} Windows ARM64 Build ${{ matrix.mode }}
    defaults:
      run:
        shell: msys2 {0}
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@main

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        update: true
        install: >-
          git
          make
          bison
          diffutils
          flex
          grep
          sed
          base-devel
          python
          python-setuptools
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-python

    - name: 'Install ARM64 cross-compilation toolchain'
      run: |
        # 安装 ARM64 交叉编译工具链
        pacman -S --noconfirm --needed mingw-w64-cross-toolchain
        
        # 搜索可用的 ARM64 交叉编译包
        echo "Available ARM64 cross packages:"
        pacman -Ss mingw-w64-cross | grep -i arm || true
        
        # 创建交叉编译目录结构
        mkdir -p /mingw64/aarch64-w64-mingw32/lib
        mkdir -p /mingw64/aarch64-w64-mingw32/include
        mkdir -p /mingw64/aarch64-w64-mingw32/bin

    - name: 'Build minimal dependencies for ARM64'
      run: |
        # 下载并编译 minimal 依赖（zlib, libffi, glib, pixman）
        cd /tmp
        
        # 下载源码
        curl -L -o zlib.tar.gz https://zlib.net/zlib-1.3.1.tar.gz
        tar xzf zlib.tar.gz
        cd zlib-1.3.1
        make -f win32/Makefile.gcc PREFIX=aarch64-w64-mingw32- -j$(nproc)
        make -f win32/Makefile.gcc PREFIX=aarch64-w64-mingw32- install \
          INCLUDE_PATH=/mingw64/aarch64-w64-mingw32/include \
          LIBRARY_PATH=/mingw64/aarch64-w64-mingw32/lib \
          BINARY_PATH=/mingw64/aarch64-w64-mingw32/bin \
          SHARED_MODE=1
        cd ..

    - name: '🚧 Build QEMU Windows ARM64 (arm & aarch64) ${{ matrix.mode }}'
      env:
        arg: ${{ matrix.mode == 'dynamic' && '--enable-sdl --enable-fdt=system --target-list=arm-softmmu,aarch64-softmmu' || '--disable-gtk --disable-spice --disable-usb-redir --disable-smartcard --disable-gnutls --disable-vnc-sasl --disable-libssh --enable-sdl --enable-fdt=system --target-list=arm-softmmu,aarch64-softmmu --static --extra-cflags="-DCURL_STATICLIB -DLIBSSH_STATIC -DLIBSLIRP_STATIC -DCAIRO_WIN32_STATIC_BUILD"' }}
      run: |
          CROSS_PREFIX="aarch64-w64-mingw32-"
          ARG="${{ env.arg }}"
          
          # 设置环境变量
          export PKG_CONFIG_PATH="/mingw64/aarch64-w64-mingw32/lib/pkgconfig:/mingw64/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/mingw64/aarch64-w64-mingw32"
          export PATH="/mingw64/bin:$PATH"
          
          echo "ARM64 cross-compilation configuration:"
          echo "ARG: $ARG"
          echo "CROSS_PREFIX: $CROSS_PREFIX"
          
          # 简化配置，禁用需要复杂依赖的功能
          SIMPLIFIED_ARG="--target-list=arm-softmmu,aarch64-softmmu --disable-gtk --disable-spice --disable-usb-redir --disable-smartcard --disable-gnutls --disable-vnc-sasl --disable-libssh --disable-sdl --disable-fdt --disable-capstone --disable-libnfs --disable-snappy --disable-libusb --disable-lzo --disable-zstd --disable-curl --disable-libslirp"
          
          if [[ "${{ matrix.mode }}" == "static" ]]; then
            SIMPLIFIED_ARG="$SIMPLIFIED_ARG --static"
          fi
          
          ./configure $SIMPLIFIED_ARG --cross-prefix=$CROSS_PREFIX
          make -j16

    - name: Prepare Artifacts
      shell: cmd
      run: |
          md ${{ github.workspace }}\artifacts
          cd ${{ github.workspace }}\artifacts
          move D:\a\qemu\qemu\build\*.exe
          move D:\a\qemu\qemu\build\pc-bios share
          robocopy D:\a\qemu\qemu\pc-bios share /xn /xo /mov
          del share\*.bz2

    - name: Prepare Artifacts (dynamic only)
      shell: cmd
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
          cd ${{ github.workspace }}\artifacts
          copy D:\a\_temp\msys64\mingw64\aarch64-w64-mingw32\bin\*.dll

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: QEMU Windows ARM64 (${{ matrix.mode }} build)
        path: ${{ github.workspace }}/artifacts
        compression-level: 9          diffutils
          flex
          grep
          sed
          base-devel
          python
          python-setuptools
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          gcc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          python:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p

    - name: 'Install ARM64 cross-compilation toolchain'
      run: |
        # 安装 ARM64 交叉编译工具链
        pacman -S --noconfirm --needed mingw-w64-cross-toolchain
        
        # 为 ARM64 安装必要的依赖库（使用正确的包名）
        pacman -S --noconfirm --needed \
          mingw-w64-cross-mingwarm64-glib2 \
          mingw-w64-cross-mingwarm64-pixman \
          mingw-w64-cross-mingwarm64-libpng \
          mingw-w64-cross-mingwarm64-SDL2 \
          mingw-w64-cross-mingwarm64-libjpeg-turbo \
          mingw-w64-cross-mingwarm64-lzo2 \
          mingw-w64-cross-mingwarm64-libffi \
          mingw-w64-cross-mingwarm64-gettext \
          mingw-w64-cross-mingwarm64-libiconv \
          mingw-w64-cross-mingwarm64-zstd \
          mingw-w64-cross-mingwarm64-libssh \
          mingw-w64-cross-mingwarm64-gnutls \
          mingw-w64-cross-mingwarm64-nettle \
          mingw-w64-cross-mingwarm64-libtasn1 \
          mingw-w64-cross-mingwarm64-libgcrypt \
          mingw-w64-cross-mingwarm64-libusb \
          mingw-w64-cross-mingwarm64-capstone \
          mingw-w64-cross-mingwarm64-dtc \
          mingw-w64-cross-mingwarm64-libnfs \
          mingw-w64-cross-mingwarm64-snappy \
          mingw-w64-cross-mingwarm64-curl \
          mingw-w64-cross-mingwarm64-libslirp

    - name: '🚧 Build QEMU Windows ARM64 (arm & aarch64) ${{ matrix.mode }}'
      env:
        arg: ${{ matrix.mode == 'dynamic' && '--enable-sdl --enable-fdt=system --target-list=arm-softmmu,aarch64-softmmu' || '--disable-gtk --disable-spice --disable-usb-redir --disable-smartcard --disable-gnutls --disable-vnc-sasl --disable-libssh --enable-sdl --enable-fdt=system --target-list=arm-softmmu,aarch64-softmmu --static --extra-cflags="-DCURL_STATICLIB -DLIBSSH_STATIC -DLIBSLIRP_STATIC -DCAIRO_WIN32_STATIC_BUILD"' }}
      run: |
          CROSS_PREFIX="aarch64-w64-mingw32-"
          ARG="${{ env.arg }}"
          
          # 设置环境变量
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:/mingw64/aarch64-w64-mingw32/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/mingw64"
          export PATH="/mingw64/bin:$PATH"
          
          echo "ARM64 cross-compilation configuration:"
          echo "ARG: $ARG"
          echo "CROSS_PREFIX: $CROSS_PREFIX"
          
          # 检查交叉编译器是否可用
          which ${CROSS_PREFIX}gcc
          ${CROSS_PREFIX}gcc --version
          
          ./configure $ARG --cross-prefix=$CROSS_PREFIX
          make -j16

    - name: Prepare Artifacts
      shell: cmd
      run: |
          md ${{ github.workspace }}\artifacts
          cd ${{ github.workspace }}\artifacts
          move D:\a\qemu\qemu\build\*.exe
          move D:\a\qemu\qemu\build\pc-bios share
          robocopy D:\a\qemu\qemu\pc-bios share /xn /xo /mov
          del share\*.bz2

    - name: Prepare Artifacts (dynamic only)
      shell: cmd
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
          cd ${{ github.workspace }}\artifacts
          copy D:\a\_temp\msys64\mingw64\aarch64-w64-mingw32\bin\*.dll
          md lib\gdk-pixbuf-2.0\2.10.0
          fsutil file createNew lib\gdk-pixbuf-2.0\2.10.0\loaders.cache 0
          move D:\a\qemu\qemu\build\po share\locale

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: QEMU Windows ARM64 (${{ matrix.mode }} build)
        path: ${{ github.workspace }}/artifacts
        compression-level: 9          diffutils
          flex
          grep
          sed
          base-devel
          python
          python-setuptools
        pacboy: >-
          toolchain:p
          binutils:p
          capstone:p
          ccache:p
          curl:p
          cyrus-sasl:p
          dtc:p
          gcc:p
          glib2:p
          gnutls:p
          gtk3:p
          libgcrypt:p
          libjpeg-turbo:p
          libnfs:p
          libpng:p
          libssh:p
          libtasn1:p
          libusb:p
          lzo2:p
          nettle:p
          ninja:p
          pixman:p
          pkgconf:p
          python:p
          SDL2:p
          SDL2_image:p
          snappy:p
          spice:p
          usbredir:p
          zstd:p
          libslirp:p

    - name: 'Install ARM64 cross-compilation toolchain'
      run: |
        pacman -S --noconfirm mingw-w64-cross-toolchain
        pacman -S --noconfirm mingw-w64-cross-gcc
        # 安装 ARM64 的依赖库
        pacman -S --noconfirm mingw-w64-cross-glib2 mingw-w64-cross-pixman mingw-w64-cross-libpng mingw-w64-cross-SDL2 mingw-w64-cross-libjpeg-turbo mingw-w64-cross-zlib mingw-w64-cross-lzo2 mingw-w64-cross-libffi mingw-w64-cross-gettext mingw-w64-cross-libiconv mingw-w64-cross-zstd mingw-w64-cross-libssh mingw-w64-cross-gnutls mingw-w64-cross-nettle mingw-w64-cross-libtasn1 mingw-w64-cross-libgcrypt mingw-w64-cross-libusb mingw-w64-cross-capstone mingw-w64-cross-dtc mingw-w64-cross-libnfs mingw-w64-cross-snappy mingw-w64-cross-curl mingw-w64-cross-libslirp

    - name: '🚧 Build QEMU Windows ARM64 (arm & aarch64) ${{ matrix.mode }}'
      env:
        arg: ${{ matrix.mode == 'dynamic' && '--enable-sdl --enable-fdt=system --target-list=arm-softmmu,aarch64-softmmu' || '--disable-gtk --disable-spice --disable-usb-redir --disable-smartcard --disable-gnutls --disable-vnc-sasl --disable-libssh --enable-sdl --enable-fdt=system --target-list=arm-softmmu,aarch64-softmmu --static --extra-cflags="-DCURL_STATICLIB -DLIBSSH_STATIC -DLIBSLIRP_STATIC -DCAIRO_WIN32_STATIC_BUILD"' }}
      run: |
          CROSS_PREFIX="aarch64-w64-mingw32-"
          ARG="${{ env.arg }}"
          
          # 设置环境变量
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="/mingw64"
          export PATH="/mingw64/bin:$PATH"
          
          echo "ARM64 cross-compilation configuration:"
          echo "ARG: $ARG"
          echo "CROSS_PREFIX: $CROSS_PREFIX"
          
          ./configure $ARG --cross-prefix=$CROSS_PREFIX
          make -j16

    - name: Prepare Artifacts
      shell: cmd
      run: |
          md ${{ github.workspace }}\artifacts
          cd ${{ github.workspace }}\artifacts
          move D:\a\qemu\qemu\build\*.exe
          move D:\a\qemu\qemu\build\pc-bios share
          robocopy D:\a\qemu\qemu\pc-bios share /xn /xo /mov
          del share\*.bz2

    - name: Prepare Artifacts (dynamic only)
      shell: cmd
      if: ${{ matrix.mode == 'dynamic' }}
      run: |
          cd ${{ github.workspace }}\artifacts
          copy D:\a\_temp\msys64\mingw64\aarch64-w64-mingw32\bin\*.dll
          md lib\gdk-pixbuf-2.0\2.10.0
          fsutil file createNew lib\gdk-pixbuf-2.0\2.10.0\loaders.cache 0
          move D:\a\qemu\qemu\build\po share\locale

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: QEMU Windows ARM64 (${{ matrix.mode }} build)
        path: ${{ github.workspace }}/artifacts
        compression-level: 9
